# Not run yet: needs a git repo on GitHub and a rokit.toml (see README).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - run: stylua --check src
      - run: selene src
      - run: rojo build default.project.json --output build/fruitGame.rbxl
      - uses: actions/upload-artifact@v4
        with:
          name: fruitGame-place
          path: build/fruitGame.rbxl

